name: ShipIt CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # 1. Automated Test Suite
  # ==========================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Tests
        run: npm test

  # ==========================================
  # 2. Build and Publish Container Image to GHCR
  # ==========================================
  build-and-push:
    name: Build & Push to GHCR
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 3. Remote Deployment to Ubuntu VPS over SSH
  # ==========================================
  deploy:
    name: Deploy to Ubuntu VPS
    needs: [test, build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS Secrets Availability
        id: check_secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "::warning::VPS_HOST or VPS_SSH_PRIVATE_KEY secret is not configured. Skipping remote SSH deployment step."
            echo "vps_configured=false" >> $GITHUB_OUTPUT
          else
            echo "vps_configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy on Ubuntu VPS over SSH
        if: steps.check_secrets.outputs.vps_configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "=== Starting ShipIt Remote Deployment ==="
            cd /opt/shipit

            # Authenticate with GHCR using GitHub Token
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull image tagged with specific commit SHA for immutable deployment
            export DOCKER_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
            echo "Deploying image: $DOCKER_IMAGE"
            docker compose pull app

            # Restart application container with zero unnecessary downtime
            docker compose up -d --remove-orphans app

            # Verify container health on localhost
            echo "Performing local health check..."
            for attempt in {1..12}; do
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/health || true)
              if [ "$RESPONSE" = "200" ]; then
                echo "Health check verification passed with HTTP 200 OK!"
                exit 0
              fi
              echo "Waiting for application to become healthy... attempt $attempt/12 (HTTP $RESPONSE)"
              sleep 3
            done

            echo "Deployment failed: Health check did not return HTTP 200 within timeout."
            exit 1
